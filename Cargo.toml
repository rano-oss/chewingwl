[package]
name = "chewingwl"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "chewingwl"
path = "src/main.rs"

[dependencies]
libcosmic = { git = "https://github.com/rano-oss/libcosmic", branch = "experimental/xx-im-preedit-start", features = ["wayland", "wayland_input_method", "winit"] }
ime-control = { path = "ime-control" }
env_logger = "0.10"
log = "0.4"
chewing = "0.9"
zbus = "5"
tokio = { version = "1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
libc = "0.2"
# Pin wayland-client: 0.31.15 breaks sctk 0.20 / iced_winit frame() API
wayland-client = "=0.31.14"
wayland-cursor = "=0.31.14"

[profile.release]
lto = true
strip = true
opt-level = "s"

[profile.dev.package."*"]
opt-level = 2


[patch."https://github.com/pop-os/libcosmic"]
libcosmic = { git = "https://github.com/rano-oss/libcosmic", branch = "experimental/xx-im-preedit-start" }
